<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="t d">
  <title id="t">Large-scale data platform: high-level reference architecture</title>
  <desc id="d">Data flows from sources through ingestion into a lakehouse with raw, bronze, silver and gold layers, is processed by stream, batch, transformation and machine-learning jobs, and is served to warehouses, dashboards, ML and APIs. Orchestration, data quality, governance, security, observability and CI/CD run across every stage.</desc>
  <defs>
    <style>
      .bg{fill:#0d1117} .zone{fill:#11161d;stroke:#30363d} .node{fill:#161b22;stroke:#30363d;stroke-width:1.2} .chip{fill:#161b22;stroke:#30363d}
      .head{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e;letter-spacing:2.5px} .zlab{font:600 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px}
      .title{font:700 13px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3} .sub{font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .cap{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590}
      .flow{fill:none;stroke:#2a313a;stroke-width:1.4}
      .run{fill:none;stroke:#58a6ff;stroke-width:1.4;stroke-dasharray:3 7;animation:dash 1.4s linear infinite}
      .run2{fill:none;stroke:#2f5d8f;stroke-width:1.1;stroke-dasharray:2 8;animation:dash 1.8s linear infinite;opacity:.8}
      .band{fill:none;stroke:#3d444d;stroke-width:1.5;stroke-dasharray:2 7;animation:dash 2s linear infinite}
      .pulse{animation:blink 1.8s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-20}} @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
      @media (prefers-reduced-motion:reduce){.run,.run2,.band,.pulse{animation:none}}
    </style>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
